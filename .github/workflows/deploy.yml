name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      # 1. Copy the existing hand-written site verbatim.
      #    The excludes matter: without them, Hugo source and internal
      #    templates would be published (Jekyll is no longer filtering them).
      - name: Stage static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_blog' \
            --exclude='_templates' \
            --exclude='_site' \
            --exclude='*.md' \
            --exclude='.DS_Store' \
            ./ _site/

      # 2. Build the blog into _site/blog/
      - name: Build blog
        run: hugo --source _blog --destination "$PWD/_site/blog" --minify

      - name: Sanity check output
        run: |
          test -f _site/index.html          || { echo "homepage missing"; exit 1; }
          test -f _site/CNAME               || { echo "CNAME missing";    exit 1; }
          test -f _site/blog/index.html     || { echo "blog index missing"; exit 1; }
          test ! -d _site/_blog             || { echo "Hugo source leaked into output"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
